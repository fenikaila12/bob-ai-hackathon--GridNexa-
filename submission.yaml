submission:
  title: "Container Congestion Predictor & Port Operations Optimiser"
  sector: "Logistics & Ports"

  problem_statement: >
    Container ports often face congestion due to high container volumes,
    vessel delays, truck queues, limited yard space, and resource shortages.
    This causes increased waiting time, operational costs, and cargo delays.

  solution_summary: >
    An AI-powered system that predicts container port congestion using vessel,
    container, truck, yard, equipment, and weather data. It provides real-time
    risk alerts and optimised recommendations for resource allocation,
    vessel scheduling, and yard management.

  key_features:
    - "AI-based container congestion prediction"
    - "Real-time congestion risk alerts and scoring"
    - "Yard occupancy and capacity prediction"
    - "Vessel and resource prioritisation"
    - "AI-powered operational recommendations"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "HTML"
      - "CSS"

    frameworks:
      - "Flask"
      - "Scikit-learn"

    ibm_technologies:
      - "IBM Bob"

    databases:
      - "PostgreSQL"

    other:
      - "XGBoost"
      - "Chart.js"
      - "GitHub"

  what_we_are_most_proud_of: >
    Our strongest feature is the combination of AI-based congestion prediction
    with operational optimisation. Instead of only detecting congestion, the
    system predicts future risks and provides actionable recommendations to
    help port operators take preventive action.

  known_limitations: >
    Prediction accuracy depends on the availability and quality of historical
    and real-time port data. The current prototype may use simulated or sample
    datasets and does not yet integrate directly with live port infrastructure.

